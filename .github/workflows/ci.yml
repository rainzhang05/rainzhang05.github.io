name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; say so rather than inherit the default.
permissions:
  contents: read

# A newer push to a pull request makes the run before it pointless. A push to
# main is a deploy, so each of those runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick-checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # One place says which Node this project runs on: .nvmrc.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

  e2e:
    name: E2E (${{ matrix.project }})
    # Pinned. ubuntu-latest is Ubuntu 26.04, where the locked Playwright (1.60)
    # cannot install its browser dependencies. Go back to ubuntu-latest once
    # Playwright is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: safari
            browser: webkit
          - project: mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # One place says which Node this project runs on: .nvmrc.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: E2E tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "true"

      # Not only on failure: a test that fails and then passes on a retry
      # leaves the job green, and its trace is the one worth reading.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
